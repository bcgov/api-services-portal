name: Delete Deployment

on:
  delete:

jobs:
  delete:
    name: Delete deployment
    # feature/* deploys the Portal stack and provisioner; tmp/* deploys only the provisioner
    if: github.event.ref_type == 'branch' && (startsWith(github.event.ref, 'feature/') || startsWith(github.event.ref, 'tmp/'))
    runs-on: ubuntu-latest
    steps:
      - name: Set DEPLOY_ID which will delete a custom deploy from 'dev' environment
        env:
          BRANCH: ${{ github.event.ref }}
        run: |
          echo "BRANCH = ${BRANCH}"
          echo "DEPLOY_ID=${BRANCH//\//-}" >> "$GITHUB_OUTPUT"
        id: set-deploy-id

      - name: Get deploy ID
        run: echo "The DEPLOY_ID is ${{ steps.set-deploy-id.outputs.DEPLOY_ID }}"

      - uses: actions/checkout@v6

      - name: Install oc
        run: |
          curl -L https://mirror.openshift.com/pub/openshift-v4/clients/ocp/latest/openshift-client-linux.tar.gz -o /tmp/openshift-client-linux.tar.gz
          tar -xzf /tmp/openshift-client-linux.tar.gz -C /tmp oc
          sudo install /tmp/oc /usr/local/bin/oc
          oc version --client

      - name: Authenticate and set context
        env:
          OPENSHIFT_SERVER: ${{ secrets.OPENSHIFT_SERVER }}
          OPENSHIFT_TOKEN: ${{ secrets.OPENSHIFT_TOKEN }}
          OPENSHIFT_NAMESPACE: ${{ env.OPENSHIFT_NAMESPACE }}
        run: |
          # Retry: a single API server timeout would otherwise leave the whole deployment behind
          for attempt in 1 2 3; do
            oc login "$OPENSHIFT_SERVER" --token="$OPENSHIFT_TOKEN" --insecure-skip-tls-verify=true && break
            if [ "$attempt" = 3 ]; then exit 1; fi
            sleep 20
          done
          if [ -n "$OPENSHIFT_NAMESPACE" ]; then
            oc project "$OPENSHIFT_NAMESPACE"
          fi

      - name: 'Get Helm'
        run: |
          # Needs >= 3.13 for 'uninstall --ignore-not-found' (3.4.2 silently ignores unknown flags)
          curl -L -O https://get.helm.sh/helm-v3.22.0-linux-amd64.tar.gz
          tar -xf helm-v3.22.0-linux-amd64.tar.gz

      - name: 'Delete DB (Postgres k8s resources)'
        run: |
          DEPLOY_ID="${{ steps.set-deploy-id.outputs.DEPLOY_ID }}"
          DB_NAME="proto-asp-${DEPLOY_ID}-db"
          oc delete deployment "${DB_NAME}" --ignore-not-found=true
          oc delete service "${DB_NAME}" --ignore-not-found=true
          oc delete pvc "${DB_NAME}-data" --ignore-not-found=true
          oc delete configmap "${DB_NAME}-init" "${DB_NAME}-keystone-schema" --ignore-not-found=true
          oc delete job "${DB_NAME}-keystone-init" --ignore-not-found=true

      - name: 'Delete ALL (Helm releases)'
        run: |
          export PATH=$PATH:`pwd`/linux-amd64
          PREFIX="proto-asp-${{ steps.set-deploy-id.outputs.DEPLOY_ID }}"

          # Each release is optional (tmp/* only has -proapi; -db is for old MongoDB Helm releases),
          # so ignore missing ones and keep going rather than stopping at the first failure.
          failed=0
          for release in "$PREFIX" "$PREFIX-routes" "$PREFIX-feeder" "$PREFIX-proapi" "$PREFIX-db"; do
            helm uninstall "$release" --ignore-not-found || failed=1
          done
          exit $failed
