name: Cypress and Execute Tests

on:
  workflow_dispatch: {}
  push:
    branches: ['test', 'cypress/*']
  pull_request:
    branches: ['dev']
    types: [opened, reopened, synchronize, ready_for_review, labeled, unlabeled]

env:
  DASHBOARD_PROJECT_ID: ${{ secrets.CY_DASHBOARD_PRJ_ID }}
  DASHBOARD_RECORD_KEY: ${{ secrets.CY_DASHBOARD_RECORD_KEY }}
  EXECUTION_ENV: prod
  GIT_COMMIT_BRANCH: ${{ github.ref_name }}
  GIT_COMMIT_SHA: ${{ github.sha }}
  GIT_COMMIT_AUTHOR: ${{ github.actor }}
  GIT_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
  GIT_REPO_URL: ${{ github.repository }}
  CYPRESS_SKIP_LABEL: 'skip-e2e'
  CYPRESS_COMMENT_MARKER: '<!-- cypress-e2e-results -->'
  CYPRESS_COMMENT_HEADING: '## Cypress E2E tests failed'
  # Optional: avoids npm 403 from registry when multiple images run npm install in parallel
  NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

jobs:
  cypress_eligibility:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - name: Check whether Cypress should run
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_ACTION: ${{ github.event.action }}
          PR_IS_DRAFT: ${{ github.event.pull_request.draft }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          EVENT_LABEL: ${{ github.event.label.name }}
        run: |
          SHOULD_RUN=false

          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            SHOULD_RUN=true
          elif [[ "$PR_ACTION" =~ ^(labeled|unlabeled)$ && "$EVENT_LABEL" != "$CYPRESS_SKIP_LABEL" ]]; then
            echo "The changed label does not affect Cypress; skipping this event."
          elif [[ "$PR_IS_DRAFT" == "true" ]]; then
            echo "The pull request is a draft; skipping Cypress."
          elif jq -e --arg label "$CYPRESS_SKIP_LABEL" 'index($label) != null' <<< "$PR_LABELS" > /dev/null; then
            echo "The pull request has the $CYPRESS_SKIP_LABEL label; skipping Cypress."
          else
            SHOULD_RUN=true
          fi

          echo "should_run=$SHOULD_RUN" >> "$GITHUB_OUTPUT"

  cypress-run:
    needs: cypress_eligibility
    if: needs.cypress_eligibility.outputs.should_run == 'true'
    concurrency:
      group: cypress-e2e-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Build GWA API Image
        run: |
          git clone https://github.com/bcgov/gwa-api.git --branch dev
          cd gwa-api/microservices/gatewayApi
          docker build -t gwa-api:e2e .

      - name: Checkout Portal
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Build Docker Images
        run: |
          docker compose --profile testsuite build

      - name: Spin up API Services Portal and Run E2E Tests
        run: |
          export CY_EXECUTION_ENV=${{ env.EXECUTION_ENV }}
          export CY_RECORD_KEY=${{ env.DASHBOARD_RECORD_KEY }}
          export CY_PROJECT_ID=${{ env.DASHBOARD_PROJECT_ID }}
          export CY_COMMIT_BRANCH=${{ env.GIT_COMMIT_BRANCH }}
          export CY_COMMIT_SHA=${{ env.GIT_COMMIT_SHA }}
          export CY_COMMIT_AUTHOR=${{ env.GIT_COMMIT_AUTHOR }}
          export CY_COMMIT_MESSAGE="${{ env.GIT_COMMIT_MESSAGE }}"
          export CY_REPO_URL=${{ env.GIT_REPO_URL }}
          export CY_COMMIT_AUTHOR_EMAIL=$(git --no-pager show -s --format='%ae' ${{ env.GIT_COMMIT_SHA }})
          docker compose --profile testsuite up -d

      - name: Execute Tests & Clean Up
        run: |
          # Start following logs in the background with continuous output
          docker logs -f cypress-e2e 2>&1 &
          LOG_PID=$!

          while true; do
            if [ "$(docker ps -aq -f status=exited -f name=cypress-e2e)" ]; then
              echo "Cypress tests completed."

              # Record why a container might have gone away during the run. Only
              # state and resource numbers are printed, plus the sdx-ui log tail
              # when it is not running, since it can exit during startup.
              echo "::group::Container state"
              docker ps -aq | xargs docker inspect --format \
                '{{.Name}} status={{.State.Status}} exit={{.State.ExitCode}} oomkilled={{.State.OOMKilled}} restarts={{.RestartCount}} finished={{.State.FinishedAt}}'
              echo "::endgroup::"
              if [ "$(docker inspect --format '{{.State.Status}}' sdx-ui 2>/dev/null)" != "running" ]; then
                echo "::group::sdx-ui logs"
                docker logs --tail 200 sdx-ui 2>&1 || true
                echo "::endgroup::"
              fi
              echo "::group::Resource usage"
              free -m
              docker stats --no-stream --format 'table {{.Name}}\t{{.CPUPerc}}\t{{.MemUsage}}\t{{.MemPerc}}'
              echo "::endgroup::"

              # cleanup
              docker compose down
              break
            else
              sleep 30s
            fi
          done

      - name: Upload E2E Test Results HTML Report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-results-html
          path: ${{ github.workspace }}/e2e/results/report

      - name: Upload E2E Test Results JSON Report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-results-json
          path: ${{ github.workspace }}/e2e/results/bcgov-aps-e2e-report.json

      - name: Upload E2E Code Coverage Report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: code-coverage
          path: ${{ github.workspace }}/e2e/coverage

      - name: Instrument the code for coverage analysis
        if: always()
        run: |
          # Rewrite the paths as the coverage starts with '../app'!
          sed -e 's/..\/app/./g' ./e2e/coverage/lcov.info > lcov.info

          #cd src
          #npm install --legacy-peer-deps
          #npx nyc instrument --compact=false . --in-place

      - name: SonarCloud Scan
        if: always()
        uses: sonarsource/sonarqube-scan-action@v7
        with:
          args: >
            -Dsonar.organization=bcgov-oss
            -Dsonar.projectKey=aps-portal-e2e
            -Dsonar.host.url=https://sonarcloud.io
            -Dsonar.projectBaseDir=src
            -Dsonar.sources=.
            -Dsonar.exclusions=nextapp/**,mocks/**,test/**,tools/**,*.json,*.js
            -Dsonar.javascript.lcov.reportPaths=/github/workspace/lcov.info
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Upload Astra scan results
        uses: actions/upload-artifact@v6
        with:
          name: astra-scan-results
          path: ${{ github.workspace }}/e2e/cypress/fixtures/state/scanResult.json

      - name: Check for failed tests and report results
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
          RESULT_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          RESULTS_FILE=$GITHUB_WORKSPACE/e2e/results/bcgov-aps-e2e-report.json
          FAILURE_COUNT=$(jq '.stats.failures' "$RESULTS_FILE")

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            COMMENTS=$(gh api --paginate \
              "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments?per_page=100")
            mapfile -t COMMENT_IDS < <(
              jq -r \
                --arg marker "$CYPRESS_COMMENT_MARKER" \
                --arg heading "$CYPRESS_COMMENT_HEADING" \
                '.[] |
                  select(.user.login == "github-actions[bot]") |
                  (.body // "") as $body |
                  select(($body | contains($marker)) or ($body | startswith($heading))) |
                  .id' <<< "$COMMENTS"
            )

            for COMMENT_ID in "${COMMENT_IDS[@]}"; do
              echo "Deleting previous Cypress results comment $COMMENT_ID."
              gh api --method DELETE \
                "repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID"
            done
          fi

          if [[ "$FAILURE_COUNT" -gt 0 ]]; then
            FAILED_TESTS=$(jq -r '
              .results[] |
              (.file | split("/") | .[2:] | join("/")) as $file |
              .. | 
              .tests? // empty | 
              .[] | 
              select(.fail == true) | 
              "- " + $file + " - " + .title
            ' "$RESULTS_FILE")
            STATS=$(jq -r '.stats | to_entries | map("\(.key)\t\(.value)") | .[]' "$RESULTS_FILE" | column -t)
            RUN_LINK="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            BRANCH="$RESULT_BRANCH"
            if [[ "$EVENT_NAME" == "pull_request" ]]; then
              COMMIT_SHA="$PR_COMMIT_SHA"
            else
              COMMIT_SHA="$GITHUB_SHA"
            fi
            SHORT_SHA="${COMMIT_SHA:0:7}"
            {
              if [[ "$EVENT_NAME" == "pull_request" ]]; then
                echo "$CYPRESS_COMMENT_MARKER"
              fi
              echo "## Cypress E2E tests failed ($FAILURE_COUNT)"
              echo ""
              echo "**Branch:** \`$BRANCH\` | **Commit:** \`$SHORT_SHA\`"
              echo ""
              echo "<details>"
              echo "<summary>Stats</summary>"
              echo ""
              echo '```'
              echo "$STATS"
              echo '```'
              echo ""
              echo "</details>"
              echo ""
              if [[ "$FAILURE_COUNT" -gt 10 ]]; then
                echo "<details>"
                echo "<summary>Failed tests ($FAILURE_COUNT)</summary>"
                echo ""
                echo "$FAILED_TESTS"
                echo ""
                echo "</details>"
              else
                echo "### Failed tests ($FAILURE_COUNT)"
                echo ""
                echo "$FAILED_TESTS"
              fi
              echo ""
              echo "[View workflow run]($RUN_LINK)"
            } > msg
            if [[ "$EVENT_NAME" == "pull_request" ]]; then
              gh pr comment "$PR_NUMBER" --body-file msg
            else
              MSG=$(cat msg)
              gh issue create --title "FAILED: Automated Tests($FAILURE_COUNT)" --body "$MSG" --label "automation" --assignee "$GIT_COMMIT_AUTHOR"
            fi
            exit 1
          fi

      - name: Set up Python 3.9
        if: failure()
        uses: actions/setup-python@v6
        with:
          python-version: '3.9'
          architecture: 'x64'

      - name: Install Python dependencies
        if: failure()
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Check Astra results and create Jira issue if necessary
        if: failure()
        run: python .github/astra-jira.py
        env:
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_KEY: ${{ secrets.JIRA_API_KEY }}
          ASTRA_SCAN_RESULTS: ${{ github.workspace }}/e2e/cypress/fixtures/state/scanResult.json
