name: Build Provisioner API

on:
  push:
    branches: [tmp/*, feature/*, dev, test]

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/.build.yml
    permissions:
      contents: read
      packages: write # 🚀 Crucial permission needed to push to ghcr.io
    with:
      name: provisioner-svc
      context: ./provisioner-api

  deploy:
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v2

      - name: Image meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}/provisioner-svc

      - name: Set DEPLOY_ID
        run: |
          echo '::set-output name=DEPLOY_ID::${{ steps.meta.outputs.version }}'
          echo '::set-output name=APP_VERSION::${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.version'] }}'
          echo '::set-output name=APP_REVISION::${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.revision'] }}'
        id: set-deploy-id

      - name: Install oc
        uses: redhat-actions/oc-installer@v1
        with:
          version: '4.6'

      - name: Authenticate to silver and set context
        env:
          OPENSHIFT_SERVER: ${{ secrets.OPENSHIFT_SERVER }}
          OPENSHIFT_TOKEN: ${{ secrets.OPENSHIFT_TOKEN }}
          OPENSHIFT_NAMESPACE: ${{ env.OPENSHIFT_NAMESPACE }}
        run: |
          for attempt in 1 2 3; do
            oc login "$OPENSHIFT_SERVER" --token="$OPENSHIFT_TOKEN" --insecure-skip-tls-verify=true && break
            if [ "$attempt" = 3 ]; then exit 1; fi
            sleep 20
          done
          if [ -n "$OPENSHIFT_NAMESPACE" ]; then
            oc project "$OPENSHIFT_NAMESPACE"
          fi

      - name: 'Get Helm'
        if: github.ref != 'refs/heads/dev'
        run: |
          curl -L -O https://get.helm.sh/helm-v3.4.2-linux-amd64.tar.gz
          tar -xf helm-v3.4.2-linux-amd64.tar.gz

      - name: 'Deploy Provisioner API'
        if: github.ref != 'refs/heads/dev'
        env:
          DEPLOY_ID: ${{ steps.set-deploy-id.outputs.DEPLOY_ID }}
          RUNNING_UID_GID: ${{ secrets.RUNNING_UID_GID }}
        run: |
          export PATH="$PATH:$(pwd)/linux-amd64"
          helm repo add bcgov https://bcgov.github.io/helm-charts
          helm upgrade --install "proto-asp-${DEPLOY_ID}-proapi" bcgov/generic-api \
            -f .github/helm/provisioner-feature.values.yaml \
            --set-string "image.tag=${DEPLOY_ID}" \
            --set-string "podAnnotations.sha=${GITHUB_SHA}" \
            --set "podSecurityContext.fsGroup=${RUNNING_UID_GID}" \
            --set "securityContext.runAsUser=${RUNNING_UID_GID}" \
            --wait --timeout 5m --history-max 3

      - name: Authenticate to Gold and set context
        if: github.ref == 'refs/heads/test'
        env:
          OPENSHIFT_SERVER: ${{ secrets.OPENSHIFT_GOLD_SERVER }}
          OPENSHIFT_TOKEN: ${{ secrets.OPENSHIFT_GOLD_TOKEN }}
          OPENSHIFT_NAMESPACE: ${{ secrets.OPENSHIFT_GOLD_TEST_NAMESPACE }}
        run: |
          for attempt in 1 2 3; do
            oc login "$OPENSHIFT_SERVER" --token="$OPENSHIFT_TOKEN" --insecure-skip-tls-verify=true && break
            if [ "$attempt" = 3 ]; then exit 1; fi
            sleep 20
          done
          if [ -n "$OPENSHIFT_NAMESPACE" ]; then
            oc project "$OPENSHIFT_NAMESPACE"
          fi

      - name: 'Restart Provisioner API in Gold Test Namespace'
        if: github.ref == 'refs/heads/test'
        run: |
          oc rollout restart deployment/bcgov-provisioner-api-generic-api -n ${{ secrets.OPENSHIFT_GOLD_TEST_NAMESPACE }}
