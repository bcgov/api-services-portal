services:
- name: sic-apikeyonly-dev-7e8ddc
  host: httpbun.com
  tags: [ns.gw-2a401]
  port: 443
  protocol: https
  retries: 0
  routes:
  - name: sic-apikeyonly-dev-7e8ddc-route
    tags: [ns.gw-2a401]
    hosts:
      - sic-apikeyonly-dev-7e8ddc.api.gov.bc.ca
    paths:
      - /
    methods:
      - GET
    strip_path: false
    https_redirect_status_code: 426
    path_handling: v0

  plugins:
  - name: key-auth
    tags: [ ns.gw-2a401 ]
    protocols: [ http, https ]
    config:
      key_names: ["X-API-KEY"]
      run_on_preflight: true
      hide_credentials: true
      key_in_body: false

