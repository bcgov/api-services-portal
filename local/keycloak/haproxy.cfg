global
    log stdout format raw local0
    maxconn 2000
    # Cypress drains a site over this socket. It is reachable on aps-net as keycloak:9999.
    stats socket ipv4@*:9999 level admin

resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 10s

defaults
    mode http
    log global
    option httplog
    option dontlognull
    option http-server-close
    timeout connect 5s
    timeout client 60s
    timeout server 60s
    timeout check 5s

# One public frontend. Site hostnames are direct backends, and every request
# is forwarded with the public Host so both sites share one issuer.
frontend public_http
    bind *:9081
    acl host_site_a hdr(host) -i keycloak-site-a.localtest.me keycloak-site-a.localtest.me:9081
    acl host_site_b hdr(host) -i keycloak-site-b.localtest.me keycloak-site-b.localtest.me:9081
    use_backend site_a if host_site_a
    use_backend site_b if host_site_b
    default_backend sites

backend sites
    balance roundrobin
    option httpchk
    http-check send meth GET uri /health/ready ver HTTP/1.1 hdr Host localhost
    http-check expect status 200
    http-request set-header Host keycloak.localtest.me:9081
    server site-a keycloak-site-a:9081 check port 9000 inter 2s fall 2 rise 2 resolvers docker init-addr last,libc,none
    server site-b keycloak-site-b:9081 check port 9000 inter 2s fall 2 rise 2 resolvers docker init-addr last,libc,none

backend site_a
    option httpchk
    http-check send meth GET uri /health/ready ver HTTP/1.1 hdr Host localhost
    http-check expect status 200
    http-request set-header Host keycloak.localtest.me:9081
    server site-a keycloak-site-a:9081 check port 9000 inter 2s fall 2 rise 2 resolvers docker init-addr last,libc,none

backend site_b
    option httpchk
    http-check send meth GET uri /health/ready ver HTTP/1.1 hdr Host localhost
    http-check expect status 200
    http-request set-header Host keycloak.localtest.me:9081
    server site-b keycloak-site-b:9081 check port 9000 inter 2s fall 2 rise 2 resolvers docker init-addr last,libc,none
